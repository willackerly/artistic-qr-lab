<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artistic QR Lab</title>
<style>body{margin:0;background:#080b12;color:#edf3ff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{max-width:680px;padding:28px;border:1px solid #26344f;border-radius:18px;background:#101725}code{color:#9fc0ff}</style>
</head>
<body><div class="card" id="status"><b>Loading Artistic QR Lab…</b><p>Reconstructing the single-page lab from source chunks.</p></div>
<script>
(async()=>{
  const files = ["app/chunks/000.txt", "app/chunks/001.txt", "app/chunks/002.txt", "app/chunks/003.txt", "app/chunks/004.txt", "app/chunks/005.txt", "app/tail/000.txt", "app/tail/001.txt", "app/tail/002.txt", "app/tail/003.txt", "app/tail/004.txt", "app/tail/005.txt", "app/tail/006.txt", "app/tail/007.txt", "app/tail/008.txt", "app/tail/009.txt", "app/tail/010.txt", "app/tail/011.txt", "app/tail/012.txt", "app/tail/013.txt", "app/tail/014.txt", "app/tail/015.txt", "app/tail/016.txt", "app/tail/017.txt", "app/tail/018.txt"];
  try {
    const parts = await Promise.all(files.map(async f => {
      const r = await fetch(f, {cache:'no-store'});
      if(!r.ok) throw new Error(`${f}: HTTP ${r.status}`);
      return r.text();
    }));
    const core = parts.join('');
    const patched = core.replace('</body>', '<script src="app/smiley-solver.js"></' + 'script><script src="app/scanner-aware.js"></' + 'script></body>');
    document.open(); document.write(patched); document.close();
  } catch (err) {
    document.getElementById('status').innerHTML = `<b>Could not load the lab.</b><p>${String(err)}</p><p>Serve this repository over HTTP, e.g. <code>python3 -m http.server 8080</code>, rather than opening index.html as a file.</p>`;
  }
})();
</script></body></html>
